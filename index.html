<!DOCTYPE html>
<html>
<head>

<style>
  :root { color-scheme:only light; --bg:#f6f5f2; --card:#fff; --ink:#1d1d1b; --muted:#7a776f; --line:#e7e4dd;
          --red:#c8372d; --green:#2f7d4f; --brand:#b5462f; --brand-ink:#fff; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { background:#f6f5f2; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:17px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif; }
  header { position:sticky; top:0; z-index:5; background:var(--card); border-bottom:1px solid var(--line);
           padding:10px 14px; display:flex; align-items:center; gap:10px; }
  header h1 { font-size:18.5px; line-height:1.15; margin:0; flex:1; min-width:0; }
  header .who { font-size:13px; color:var(--muted); text-align:right; display:flex; align-items:center; gap:10px; }
  header button.rf { text-decoration:none; color:var(--ink); width:36px; height:36px; border:1px solid var(--line); border-radius:10px; background:var(--card); display:inline-flex; align-items:center; justify-content:center; }
  header button.rf.spin svg { animation:rfspin .8s linear infinite; } @keyframes rfspin { to { transform:rotate(360deg); } }
  #sTitle:empty { display:none; }
  header button { border:0; background:none; color:var(--muted); font-size:14px; text-decoration:underline; padding:0; }
  .tools { padding:10px 14px 0; display:flex; gap:8px; }
  .tools input { flex:1; padding:9px 12px; border:1px solid var(--line); border-radius:10px; font-size:17px; background:var(--card); }
  .chips { padding:8px 14px 0; display:flex; gap:6px; flex-wrap:wrap; }
  .chip { border:1px solid var(--line); background:var(--card); border-radius:999px; padding:5px 12px; font-size:15px; }
  .chip.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .group { margin:14px 14px 4px; font-size:14px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
  .list { background:var(--card); margin:0 10px; border-radius:12px; border:1px solid var(--line); overflow:hidden; }
  .row { display:flex; align-items:center; gap:10px; padding:10px 12px; border-top:1px solid var(--line); }
  .row:first-child { border-top:0; }
  .info { flex:1; min-width:0; }
  .name { font-weight:600; word-break:break-word; }
  .row.todo .name { color:var(--red); }
  .row.done .name::after { content:" ✓"; color:var(--green); font-weight:700; }
  .hint { font-size:14.5px; color:var(--muted); margin-top:1px; }
  .meta { font-size:13px; color:var(--muted); margin-top:2px; }
  .qty { width:84px; flex:none; text-align:center; font-size:20.5px; padding:9px 6px; border:1.5px solid var(--line); border-radius:10px; background:#fff; }
  .qty:focus { outline:none; border-color:var(--ink); }
  .qty.changed { border-color:var(--brand); background:#fdf3ef; }
  .spacer { height:96px; }
  footer { position:fixed; left:0; right:0; bottom:0; background:var(--card); border-top:1px solid var(--line);
           padding:10px 12px calc(10px + env(safe-area-inset-bottom)); display:flex; gap:10px; align-items:center; }
  footer .prog { flex:1; font-size:15px; color:var(--muted); }
  .btn { border:0; border-radius:10px; padding:12px 16px; font-size:17px; font-weight:600; }
  .btn.save { background:var(--brand); color:var(--brand-ink); min-width:110px; }
  .btn.save:disabled { opacity:.45; }
  .btn.clear { background:#efece6; color:var(--ink); }
  .center { max-width:320px; margin:18vh auto 0; padding:0 20px; text-align:center; }
  .center h1 { font-size:25.5px; margin:0 0 4px; }
  .center p { color:var(--muted); margin:0 0 18px; }
  .pin { width:100%; font-size:32px; letter-spacing:.4em; text-align:center; padding:12px; border:1.5px solid var(--line); border-radius:12px; }
  .err { color:var(--red); min-height:20px; margin:10px 0; font-size:16px; }
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.35); display:none; align-items:flex-end; justify-content:center; z-index:20; }
  .modal.show { display:flex; }
  .sheet { background:#fff; width:100%; max-width:480px; border-radius:16px 16px 0 0; padding:20px 18px calc(18px + env(safe-area-inset-bottom)); }
  .sheet h2 { margin:0 0 6px; font-size:20.5px; }
  .sheet p { margin:0 0 16px; color:var(--muted); }
  .sheet .btns { display:flex; gap:10px; }
  .sheet .btns .btn { flex:1; }
  .btn.danger { background:var(--red); color:#fff; }
  .toast { position:fixed; left:50%; bottom:90px; transform:translateX(-50%); background:var(--ink); color:#fff;
           padding:9px 16px; border-radius:999px; font-size:16px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:30; }
  .toast.show { opacity:1; }
  .lang { border:1px solid var(--line); background:var(--card); border-radius:999px; padding:4px 10px; font-size:15px; font-weight:600; color:var(--ink); text-decoration:none; }
  .center .lang { position:absolute; top:14px; right:14px; }
  .sub { font-weight:400; color:var(--muted); font-size:15px; }
  .empty { padding:30px; text-align:center; color:var(--muted); }
  .name.ph { cursor:pointer; text-decoration:underline dotted; text-underline-offset:3px; }
  .phtag { color:var(--brand); font-weight:600; }
  .pbody { min-height:120px; display:flex; align-items:center; justify-content:center; margin:0 0 16px; color:var(--muted); }
  .pbody img { max-width:100%; max-height:60vh; border-radius:10px; }
  .tabs { display:flex; gap:5px; padding:8px 10px 0; }
  .tabs .tab { min-width:0; padding:8px 3px; }
  .tabs:has(.tab:nth-child(5)) .tab { flex:1 1 auto; font-size:14px; }
  .tab { flex:1; border:1px solid var(--line); background:var(--card); border-radius:10px; padding:8px; font-size:16px; font-weight:600; color:var(--muted); }
  .tab.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .banner { margin:10px 10px 0; padding:12px; border-radius:12px; background:#fdf3ef; border:1px solid #f0d3c8; font-size:16px; }
  .banner .btn { margin-top:8px; width:100%; }
  .btn.ghost { background:#efece6; color:var(--ink); }
  .srow { display:flex; justify-content:space-between; gap:8px; padding:7px 0; border-top:1px solid var(--line); font-size:16px; }
  .srow:first-child { border-top:0; }
  .srow b { white-space:nowrap; }
  .srow.tot { font-size:18.5px; border-top:2px solid var(--ink); }
  .slist { max-height:45vh; overflow:auto; margin-bottom:14px; }
  .sheet .btns.col { flex-direction:column; }
  .qty:disabled { background:#f1efea; color:var(--muted); }
  .card { background:var(--card); margin:10px; border-radius:12px; border:1px solid var(--line); overflow:hidden; }
  .card h3 { margin:0; padding:12px 12px 2px; font-size:18.5px; }
  .card .cmeta { padding:0 12px 8px; font-size:15px; color:var(--muted); }
  .msg { margin:0 12px 10px; padding:10px; background:#f1efea; border-radius:10px; font-size:17px; }
  .warn { margin:0 12px 10px; color:var(--red); font-size:15.5px; }
  .ok { color:var(--green); font-weight:600; }
  .card .actions { display:flex; gap:8px; padding:0 12px 12px; }
  .card .actions .btn { flex:1; text-align:center; text-decoration:none; }
  .btn.wa { background:#25a244; color:#fff; }
  .btn.wa.dis { opacity:.45; pointer-events:none; }
  .idle { margin:14px 10px; padding:10px 12px; border:1px dashed var(--line); border-radius:12px; color:var(--muted); font-size:15.5px; }
  .idle b { color:var(--ink); font-weight:600; }
  .idle .it { padding:6px 0; border-top:1px solid var(--line); cursor:pointer; }
  .idle .it:first-of-type { border-top:0; }
  .boot { position:fixed; inset:0; background:#ffefd8; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; z-index:40; }
  .mc { position:relative; width:min(52vw,210px); }
  .mc img { display:block; width:100%; height:auto; }
  .mc .body { transform-origin:50% 100%; animation:nom .9s ease-in-out infinite; }
  .mc .marks { position:absolute; left:0; top:0; animation:pop .9s ease-in-out infinite; transform-origin:30% 30%; }
  .mc .steam { position:absolute; width:9%; height:16%; border-radius:50%; background:rgba(255,255,255,.85); filter:blur(3px); opacity:0; animation:steam 1.8s ease-out infinite; }
  .mc .s1 { left:14%; top:50%; } .mc .s2 { left:72%; top:50%; animation-delay:.9s; }
  .boot .bt { color:var(--muted); font-size:16px; letter-spacing:.02em; }
  .boot .bt span { display:inline-block; animation:dot 1.2s infinite; } .boot .bt span:nth-child(2){animation-delay:.2s} .boot .bt span:nth-child(3){animation-delay:.4s}
  @keyframes nom { 0%,100% { transform:translateY(0) scale(1,1); } 30% { transform:translateY(2%) scale(1.03,.96); } 55% { transform:translateY(-2%) scale(.98,1.03); } 75% { transform:translateY(1%) scale(1.02,.98); } }
  @keyframes pop { 0%,100% { opacity:.2; transform:scale(.9); } 45% { opacity:1; transform:scale(1.06); } }
  @keyframes steam { 0% { opacity:0; transform:translateY(0) scale(.7); } 30% { opacity:.8; } 100% { opacity:0; transform:translateY(-120%) scale(1.3); } }
  @keyframes dot { 0%,60%,100% { opacity:.2; } 30% { opacity:1; } }
  .dbtns { display:flex; gap:8px; padding:10px 10px 0; flex-wrap:wrap; }
  .dbtns .btn { flex:1; min-width:140px; padding:11px 12px; }
  .drow { cursor:pointer; }
  .pick { cursor:pointer; align-items:center; }
  .qins { display:flex; gap:6px; flex:none; }
  .qin { display:flex; flex-direction:column; align-items:center; font-size:13px; color:var(--muted); }
  .qty.sm { width:66px; font-size:19.5px; padding:8px 4px; }
  #sum.picker .sheet { max-height:88vh; display:flex; flex-direction:column; }
  #sum.picker .slist { flex:1; max-height:none; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .dec { font-size:14.5px; color:var(--muted); text-decoration:none; display:inline-block; margin-top:3px; }
  .dec.on { color:var(--brand); font-weight:600; }
  .decbox { display:inline-block; width:66px; text-align:center; font-size:15px; padding:10px 0; border:1.5px dashed #e3b8aa; border-radius:10px; color:var(--brand); font-weight:600; }
  .asbar { position:sticky; top:0; z-index:40; background:#1f5fa8; color:#fff; text-align:center; padding:9px 12px; font-size:16px; font-weight:600; cursor:pointer; }
  .swrap { position:relative; background:var(--red); }
  .swrap + .swrap { border-top:1px solid var(--line); }
  .swrap > .row { position:relative; z-index:1; background:var(--card); border-top:0; transition:transform .15s; touch-action:pan-y; }
  .swrap > .row.open { transform:translateX(-76px); }
  .swrap > .bin { position:absolute; right:0; top:0; bottom:0; width:76px; border:0; background:var(--red); color:#fff; font-size:27.5px; }
  .lvh { font-weight:700; margin:12px 0 2px; }
  .undo { position:fixed; left:12px; right:12px; bottom:86px; z-index:60; display:none; align-items:center; justify-content:space-between; gap:10px; background:#222; color:#fff; padding:10px 14px; border-radius:12px; font-size:16px; }
  .undo.show { display:flex; } .undo button { background:none; border:0; color:#ffd27a; font-weight:700; font-size:17px; }
  .needbox { margin:10px 14px 0; padding:10px 12px; background:#fff3e0; border:1px solid #f3c98b; border-radius:12px; font-size:16px; line-height:1.5; }
  .lv { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 0; font-size:16px; border-bottom:1px solid var(--line); }
  .lv span { white-space:nowrap; }
  .btn.low { background:#f0a030; color:#fff; }
  .use1 { flex:none; min-width:0; padding:8px 12px; margin-right:8px; font-weight:700; }
  .badge { display:inline-block; min-width:18px; padding:0 5px; border-radius:9px; background:var(--red); color:#fff; font-size:13px; line-height:18px; margin-left:4px; }
  .pq { width:100%; padding:9px 12px; border:1px solid var(--line); border-radius:10px; font-size:17px; }
.lgh{padding:10px 14px 4px;font-size:15px;font-weight:700;color:var(--brand);background:transparent}
.robar{margin:6px 14px 0;padding:6px 10px;border-radius:8px;background:#eef3fb;color:#2b4c7e;font-size:15px;font-weight:600;text-align:center}
body.ro footer, body.ro .use1, body.ro .dbtns .btn.save, body.ro .dbtns .btn.clear, body.ro .lvl, body.ro .bin { display:none !important; }
body.ro .card .btn.save, body.ro .card .btn.ghost { display:none !important; }
body.ro input.qty { pointer-events:none; background:transparent; border-color:transparent; }
.ver{font-size:10px;color:var(--muted);opacity:.7}
.tab.menu{flex:none;min-width:44px}
.otag{display:inline-block;margin-top:4px;padding:2px 8px;border-radius:8px;background:#e8f1fb;color:#1f5fa8;font-size:13px;font-weight:600}.otag.short{background:#fff3e0;color:#a35a00}
.mic{display:inline-flex;align-items:center;gap:6px}
.macct{display:flex;flex-direction:column;gap:2px;padding:4px 0 10px;font-size:18px}
header button.hmenu{flex:none;width:40px;height:40px;margin:-6px 0 -6px -6px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-size:22px;line-height:1;text-decoration:none;padding:0}
header button.hmenu.hx{margin:-6px -6px -6px 0}
header button.hmenu.on{border-color:var(--brand);color:var(--brand)}
.bigq{flex:none;text-align:right;font-size:28px;font-weight:700;line-height:1.05}.bigq small{display:block;font-size:14px;font-weight:600;color:var(--muted)}
</style>

<body>
<div id="asbar" class="asbar" onclick="backOwner()" hidden></div>
<div id="app"></div>
<div class="modal" id="confirm"><div class="sheet">
  <h2 id="cTitle">Clear count?</h2><p id="cText"></p>
  <div class="btns"><button class="btn clear" id="cCancel" onclick="closeConfirm()">Cancel</button>
  <button class="btn danger" id="cOk" onclick="doClear()">Clear</button></div>
</div></div>
<div class="modal" id="photo" onclick="closePhoto()"><div class="sheet" onclick="event.stopPropagation()">
  <h2 id="pTitle"></h2><div id="pBody" class="pbody"></div>
  <div class="btns"><button class="btn clear" id="pClose" onclick="closePhoto()">Close</button></div>
</div></div>
<div class="modal" id="sum" onclick="closePick()"><div class="sheet" onclick="event.stopPropagation()">
  <h2 id="sTitle"></h2><p id="sText"></p><div class="slist" id="sList"></div>
  <div class="btns col" id="sBtns"></div>
</div></div>
<div class="toast" id="toast"></div>

<script>
let PIN = null, DATA = null, FILTER = '', GROUP = 'All', EDITS = {};
let MODE = 'daily', MODE_SET = '', MD = null, MLOC = 'All', MEDITS = {}, OD = null, USER = null;
// Last data seen on this phone → tabs open instantly, then refresh quietly in the background
function remember(k, d){ if (k === 'deliv' && d && d.list) overlay(d); try { if (d) localStorage.setItem('xym_snap_' + k + '_' + PIN, JSON.stringify(d)); } catch(e){} return d; }
function recall(k){ try { const j = localStorage.getItem('xym_snap_' + k + '_' + PIN), d = j ? JSON.parse(j) : null; const r = store.get('xym_role');
  if (d && d.user && d.user.role && r && d.user.role !== r) return null;   // a saved screen from another account is never shown
  return d; } catch(e){ return null; } }
function hhmm(){ const d = new Date(); return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); }
const $ = s => document.querySelector(s);
const store = { get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
                set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
                del(k){ try{ localStorage.removeItem(k); }catch(e){} } };
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function bootHtml(){ return `<div class="boot"><div class="mc"><img class="body" src="mascot.png" alt="" onerror="this.parentNode.remove()"><img class="marks" src="mascot-marks.png" alt="" onerror="this.remove()"><i class="steam s1"></i><i class="steam s2"></i></div><div class="bt">${T('loading').replace(/[.…]+$/,'')}<span>.</span><span>.</span><span>.</span></div></div>`; }
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'), 1800); }
// Inside Google (browser link): google.script.run. Installable app: POST to the same script's web-app URL.
const API_URL = 'https:\/\/script.google.com/macros/s/AKfycbz3iJWKR2UyudaZZuEXOfWaPLTFl9QH1fwy4xCRXQIFQAj9ci7ztmW5pi64WDFNJMQSZw/exec';
function call(fn, ...args){
  const p = (window.google && google.script && google.script.run)
    ? new Promise((ok, bad) => google.script.run.withSuccessHandler(ok).withFailureHandler(e => bad(e))[fn](...args))
    : fetch(API_URL, { method:'POST', body: JSON.stringify({ fn, args }) }).then(r => r.json()).then(r => { if (!r.ok) throw new Error(r.error); return r.data; });
  // an answer for another account (owner switched account while it was loading) is thrown away, so it never shows on the new account
  const pin = args[0];
  const stale = () => pin !== undefined && PIN && pin !== PIN && typeof pin === 'string' && /^\d+$/.test(pin);
  return p.then(d => stale() ? new Promise(() => {}) : d, e => stale() ? new Promise(() => {}) : Promise.reject(e));
}

// ---------- Language (English / 中文), remembered on this phone ----------
let LANG = store.get('xym_lang') || 'en';
const TXT = {
  en: { title:'Daily Count', logout:'Log out', search:'Search item…', pin:'Enter your PIN', login:'Log in', checking:'Checking…',
        wrongPin:'Wrong PIN', again:'Please log in again', loading:'Loading…', noItems:'No items', all:'All',
        prog:(d,n)=>`${d}/${n} counted today`, unsaved:n=>` · ${n} unsaved`, clear:'Clear', save:'Save', saveN:n=>`Save (${n})`,
        numbers:'Numbers only please', saved:n=>`Saved ${n} item${n===1?'':'s'} ✓`, cleared:n=>`Cleared ${n} item${n===1?'':'s'}`,
        clearAllT:'Clear ALL daily counts?', clearAllX:'Every daily quantity for all areas will be blanked.',
        clearT:a=>`Clear ${a} count?`, clearX:a=>`Only ${a} items are cleared. Other areas are not touched.`,
        cancel:'Cancel', close:'Close', loadingPhoto:'Loading photo…', noPhoto:'No photo yet', photoFail:'Could not load photo',
        photo:'Photo', last:'last', updated:'Updated', notSent:'⚠ not sent yet – retrying', clearNotSent:'⚠ clear not sent yet – retrying',
        clearFail:'Clear failed – check internet', listChanged:'Item list changed – reloading', noConn:'No connection', retry:'Try again',
        report:'Send report', other:'中文',
        rDone:(a,w)=>`✅ ${a} count done – ${w}`, rNot:(a,w)=>`⚠️ ${a} count NOT complete – ${w}`, rCounted:(d,n)=>`${d}/${n} counted`,
        rLow:'Low (below min):', rMin:'min', rMissing:'Not counted:', rNone:'none',
        daily:'Daily', month:'Month-End', meTitle:'Month-End Count', meProg:(d,n)=>`${d}/${n} counted`,
        summary:'Summary', start:'Start month-end now', closeME:'Close month-end', exportX:'Export Excel',
        meOff:'Month-end count is not open.', meNext:d=>`Next month-end: ${d}`, meOn:d=>`Month-end open since ${d}`,
        meAuto:'Opens by itself on the dates in the MonthEndDates tab.', total:'Total', making:'Making Excel file…',
        download:'Download Excel', openSheet:'Open in Google Sheets', started:'Month-end started', closedMsg:'Month-end closed',
        sumTitle:'Month-End Summary', sumText:(d,n)=>`${d}/${n} lines counted · value = qty × unit price`, closeConfirm:'Close month-end? Staff go back to the daily count.',
        order:'Order', orderTitle:'Supplier Order', delivery:d=>`For delivery tomorrow (${d})`, offTmr:(n,d)=>`${n} is off tomorrow (${d}) – no order today`,
        beforeOff:'Day before their off day – stock up to the higher par', onHand:'on hand', par:'par', notToday:d=>`⚠ not counted today${d?' (last '+d+')':''}`,
        countedToday:'counted today', underMin:(t,m)=>`⚠ Total ${t} – under minimum order ${m}, supplier may not deliver`,
        sendWa:'Send on WhatsApp', copy:'Copy message', copied:'Copied', orderedToday:'✓ Ordered today', markOrdered:'Mark as ordered', noWa:'No WhatsApp for this supplier – tell them the list above (in person / by phone), then tap Mark as ordered.', recorded:'Order recorded', noOrder:'Nothing to order', belowMinShort:(n,m)=>`only ${n} needed, under minimum ${m}`, idleTitle:'No order needed today', enough:'stock enough', nothingToday:'Nothing to order today ✓', tapOpen:'tap to order by hand', closeCard:'close', belowMin:(n,m)=>`No order today – only ${n} needed, under minimum ${m}`, noSup:'No supplier items set up yet' },
  zh: { title:'每日盘点', logout:'登出', search:'搜索货品…', pin:'请输入密码', login:'登录', checking:'检查中…',
        wrongPin:'密码错误', again:'请重新登录', loading:'加载中…', noItems:'没有货品', all:'全部',
        prog:(d,n)=>`今日已点 ${d}/${n}`, unsaved:n=>` · ${n} 项未保存`, clear:'清除', save:'保存', saveN:n=>`保存 (${n})`,
        numbers:'请只输入数字', saved:n=>`已保存 ${n} 项 ✓`, cleared:n=>`已清除 ${n} 项`,

async function load(){

// ---------- Already ordered from Jinjang (open orders: asked / on the way) ----------
function ordDay(t){ const m = String(t || '').match(/^(\d{1,2})\/(\d{1,2})/); if (m) return m[1].padStart(2,'0') + '/' + m[2].padStart(2,'0'); const d = new Date(); return String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0'); }
// Latest Jinjang order of each item: still open (asked / on the way) → counts as already ordered;
// received but Jinjang sent less (no stock) → only a note "ordered dd/mm · Jinjang no stock" (no extra order is made).
function openOrd(){
  const d = DV || recall('deliv'), m = {}; if (!d || !d.list) return m;
  const now = new Date(), old = o => { const x = ordDay(o.createdAt).split('/'); const t = new Date(now.getFullYear(), Number(x[1]) - 1, Number(x[0])); if (t > now) t.setFullYear(t.getFullYear() - 1); return (now - t) / 86400000 > 7; };
  d.list.forEach(o => { if (o.dir !== 'JB' || o.status === 'Cancelled') return;
    o.lines.forEach(l => { if (l.id in m) return;   // newest order wins (list is newest first)
      const req = Number(l.req) || 0, sent = Number(l.sent) || 0, day = ordDay(o.createdAt);
      if (o.status === 'Requested') { if (req > 0 || l.decide) m[l.id] = { kind: 'open', q: req, unit: l.unit, id: o.id, day }; return; }
      if (o.status === 'Sent') { if (sent > 0) m[l.id] = { kind: 'way', q: sent, unit: l.unit, id: o.id, day, short: req > sent ? req - sent : 0 }; else if (req > 0 && !old(o)) m[l.id] = { kind: 'short', q: req, unit: l.unit, id: o.id, day }; else m[l.id] = null; return; }
      if (req > 0 && sent < req && !old(o)) m[l.id] = { kind: 'short', q: req - sent, unit: l.unit, id: o.id, day }; else m[l.id] = null; }); });
  Object.keys(m).forEach(k => { if (!m[k]) delete m[k]; });
  return m;
}
function ordTag(id){ const x = OPEN_ORD[id]; if (!x) return ''; const q = x.q ? ' ' + (Math.round(x.q * 1000) / 1000) + ' ' + esc(uName(x.unit)) : '';
  const t = x.kind === 'open' ? T('ordered') + ' ' + x.day + q : x.kind === 'way' ? T('onWay') + q : T('ordered') + ' ' + x.day + q + ' · ' + T('jjNoStock');
  return `<div class="otag ${x.kind === 'short' ? 'short' : ''}">🛒 ${t} · ${esc(x.id)}</div>`; }
const openQ = x => x && (x.kind === 'open' || x.kind === 'way') ? x.q : 0;   // only orders still coming count as "already ordered"
let OPEN_ORD = {};
function ordRefresh(){ const k = JSON.stringify(OPEN_ORD); OPEN_ORD = openOrd(); if (JSON.stringify(OPEN_ORD) === k || busy()) return;
  if (MODE === 'daily' && DATA && $('#body')) redraw(drawList); else if (MODE === 'stock' && SK) redraw(renderStock); }

function drawList(){

        <div class="info"><div class="name ${i.photo?'ph':''}" ${i.photo?`onclick="showPhoto(${i.row})"`:''}>${esc(itemName(i))}${sub?` <span class="sub">${esc(sub)}</span>`:''}</div>

          <div class="meta">${i.photo?`<span class="phtag">${T('photo')}</span> · `:''}${esc(i.uom)}${i.at ? ' · '+T('updated')+' '+esc(i.at) : ''}${i.lv && isBoss() ? lvLink(i, uName(String(i.uom).toLowerCase())) : ''}</div>${ordTag(i.id)}</div>

      </div>`; }).map((h, k) => swipeWrap(by[g][k].id, h)).join('') + '</div>').join('') || `<div class="empty">${T('noItems')}</div>`;
  swipeRows();

    e.target.classList.toggle('changed', row in EDITS); updateFooter();
  }));
  updateFooter();
}

function updateFooter(){
  const n = Object.keys(EDITS).length;

async function save(){
  const changes = Object.keys(EDITS).map(r => { const it = DATA.items.find(x => x.row===Number(r)); return { row:it.row, id:it.id, qty:EDITS[r] }; });

  changes.forEach(c => { const it = DATA.items.find(x => x.row===c.row);

// Background sender: keeps unsent counts on the phone and retries until the server has them
let FLUSHING = false;
async function flush(tries){
  tries = tries||0;
  if (FLUSHING) return; FLUSHING = true;
  const pend = JSON.parse(store.get('xym_pending')||'[]');
  if (!pend.length){ FLUSHING=false; return; }
  const last = {}; pend.forEach(c => last[c.row] = c);
  try { await call('saveDaily', PIN, Object.values(last)); store.del('xym_pending'); FLUSHING=false; setSync(''); }
  catch(e){
    FLUSHING=false;
    if (String(e.message||e).includes('reload')) { store.del('xym_pending'); toast(T('listChanged')); load(); return; }
    setSync(T('notSent'));
    setTimeout(() => flush(tries+1), Math.min(30000, 3000*(tries+1)));
  }
}
function setSync(t){ const el=$('#prog'); if(el && t) el.textContent = t; else if (DATA && $('#prog')) updateFooter(); }

// ---------- Photo ----------
const PHOTOS = {};
// Photos are kept on the phone (made smaller first) → open instantly next time, even after logging in again
function photoGet(id){ if (PHOTOS[id]) return PHOTOS[id]; try { return localStorage.getItem('xym_ph_' + id); } catch(e){ return null; } }
function photoKeep(id, url){
  PHOTOS[id] = url; if (!url) return;
  const img = new Image();
  img.onload = () => { try {
    const k = Math.min(1, 800 / Math.max(img.width, img.height)), c = document.createElement('canvas');
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    const small = c.toDataURL('image/jpeg', 0.72); PHOTOS[id] = small;
    try { localStorage.setItem('xym_ph_' + id, small); } catch(e){}
  } catch(e){} };
  img.src = url;
}
async function photoLoad(row, id){ const hit = photoGet(id); if (hit) return hit; const url = await call('getPhoto', PIN, row, id); photoKeep(id, url); return url; }
async function showPhoto(row){

function drawOrders(){

    const rows = s.lines.map((l, li) => `<div class="row">

    .catch(e => { list.forEach(x => SUSE[x.id] = (SUSE[x.id] || 0) + x.n); toast(String(e.message||e)); SUSE_T = setTimeout(flushUse, 5000); return false; });
  const ok = await SUSE_BUSY; SUSE_BUSY = null; return ok;
}
// ---------- ☰ Menu (Owner / View-only) + Usage report ----------
function menuBtn(){ return PIN ? `<button class="hmenu ${MODE==='usage'?'on':''}" onclick="openMenu()" aria-label="Menu">☰</button>` : ''; }
let UPREV = 'daily';
const isPage = m => m === 'usage' || m === 'dlog';   // full-screen pages opened from ☰ (✕ / Back return to where you were)
function openUsage(m){ closeSum(); if (!isPage(MODE)) UPREV = MODE || 'daily'; setMode(m || 'usage'); }
function closeUsage(){ if (isPage(MODE)) setMode(UPREV); }
// Phone Back button = the app's Back: close a box → leave report / order → previous tab → (nothing left) leave the app
function appBack(){
  for (const id of ['sum', 'confirm', 'photo']) { const el = $('#' + id); if (el && el.classList.contains('show')) { el.classList.remove('show', 'picker'); return true; } }
  if (isPage(MODE)) { closeUsage(); return true; }
  if (MODE === 'deliv' && DVIEW) { DVIEW = null; renderDeliv(); window.scrollTo(0, 0); return true; }
  return false;   // on a tab: no tab history – Back twice closes the app
}
let BACK_AT = 0;
try { history.replaceState({ xym:'base' }, ''); history.pushState({ xym:'top' }, ''); } catch(e){}
window.addEventListener('popstate', () => {
  let done = false; try { done = PIN && appBack(); } catch(e){}
  if (!done && Date.now() - BACK_AT < 2500) { history.back(); return; }   // second Back within 2.5 s → leave the app
  if (!done) { BACK_AT = Date.now(); toast(T('backExit')); }
  try { history.pushState({ xym:'top' }, ''); } catch(e){}
});
function openMenu(){
  const u = curUser(), boss = u.role === 'Owner' || u.role === 'Viewer', sw = store.get('xym_owner') && store.get('xym_owner') !== PIN;
  const today = (DATA && DATA.today) || (DV && DV.today) || (SK && SK.today) || (MD && MD.me && MD.me.today) || (OD && OD.today) || '';
  $('#sTitle').textContent = ''; $('#sText').textContent = '';
  $('#sList').innerHTML = `<div class="macct"><b>👤 ${esc(areaName(whoKey(u)))}</b><span class="sub">${esc(today)} · ${APP_V}</span></div>` +
    (boss ? `<div class="srow pick" onclick="openUsage()"><span>📊 ${T('usageT')}</span><b class="sub">›</b></div>
    <div class="srow pick" onclick="openUsage('dlog')"><span>📋 ${T('dlogT')}</span><b class="sub">›</b></div>
    <div class="srow pick" onclick="openStatement(0)"><span>🧾 ${T('statement')}</span><b class="sub">›</b></div>` : '') +
    (sw ? `<div class="srow pick" onclick="closeSum();backOwner()"><span>← ${T('ownerShort')}</span><b class="sub">›</b></div>`
        : `<div class="srow pick" onclick="closeSum();logout()" style="color:var(--red)"><span class="mic"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg> ${T('logout')}</span><b class="sub">›</b></div>`);
  $('#sBtns').innerHTML = `<button class="btn clear" onclick="closeSum()">${T('close')}</button>`;
  $('#sum').classList.add('show');
}
// ---------- Daily count records (every saved daily count, by day) ----------
let DLZ = null, DLDAY = '';
async function loadDlog(day){
  MODE = 'dlog'; if (day !== undefined) DLDAY = day; DLZ = Object.assign({}, DLZ || {}, { loading: true }); renderDlog();
  try { DLZ = await call('getDailyLog', PIN, DLDAY || ''); DLDAY = DLZ.day; } catch(e){ DLZ = { error: String(e.message||e) }; }
  if (MODE === 'dlog') renderDlog();
}
function renderDlog(){
  const z = DLZ || {}, dd = d => d.slice(8,10) + '/' + d.slice(5,7);
  const chips = (z.days || []).length ? `<div class="chips" style="flex-wrap:nowrap;overflow-x:auto">${z.days.map(([d, n]) => `<button class="chip ${d===DLDAY?'on':''}" style="flex:none" onclick="loadDlog('${d}')">${dd(d)}</button>`).join('')}</div>` : '';
  let body = '';
  if (z.loading) body = `<div class="empty">${T('loading')}</div>`;
  else if (z.error) body = `<div class="empty">${esc(z.error)}</div>`;
  else { const by = {}; (z.rows || []).forEach(r => { const g = r.grp || r.who || ''; (by[g] = by[g] || []).push(r); });
    body = Object.keys(by).sort().map(g => `<div class="group">${esc(areaName(g))} · ${by[g].length}</div><div class="list">${by[g].map(r =>
      `<div class="row"><div class="info"><div class="name">${lineName(r)}</div><div class="meta">${esc(r.t)} · ${esc(areaName(r.who))}</div></div>
        <div class="bigq">${esc(r.qty)}<small>${esc(uName(r.unit))}</small></div></div>`).join('')}</div>`).join('') || `<div class="empty">${T('dlogNone')}</div>`; }
  $('#app').innerHTML = `<header><h1>${T('dlogT')}</h1><button class="hmenu hx" onclick="closeUsage()" aria-label="Close">✕</button></header>${chips}${body}<div class="spacer"></div>`;
}
let UZ = null, UDAYS = 7;
async function loadUsage(days){
  MODE = 'usage'; if (days) UDAYS = days; UZ = { loading: true }; renderUsage();
  try { UZ = await call('getUsage', PIN, UDAYS); } catch(e){ UZ = { error: String(e.message||e) }; }
  if (MODE === 'usage') renderUsage();
}
function renderUsage(){
  const f = v => v === '' || v === undefined ? '–' : +(+v).toFixed(2);
  const chips = `<div class="chips">${[7, 14, 30].map(d => `<button class="chip ${d===UDAYS?'on':''}" onclick="loadUsage(${d})">${T('lastNd', d)}</button>`).join('')}</div>`;
  let body = '';
  if (UZ.loading) body = `<div class="empty">${T('loading')}</div>`;
  else if (UZ.error) body = `<div class="empty">${esc(UZ.error)}</div>`;
  else {
    const g = i => i.kind === 'stock' ? 'g' + (i.grp === 'Noodle' ? 'Noodle' : i.grp === 'Bought' ? 'Bought' : 'Jinjang') : 'daily', order = ['daily', 'gJinjang', 'gBought', 'gNoodle'];
    const by = {}; UZ.items.forEach(i => (by[g(i)] = by[g(i)] || []).push(i));
    body = order.filter(k => by[k]).map(k => `<div class="group">${T(k)} · ${by[k].length}</div><div class="list">${by[k].map(i => { const un = esc(uName(i.unit));
      return `<div class="row"><div class="info"><div class="name">${lineName(i)}</div>
        <div class="meta">${T('uWd')} <b>${f(i.wd)}</b> ${un}${i.sat !== '' ? ` · ${T('uSat')} <b>${f(i.sat)}</b>` : ''} · ${T('uTot', f(i.total), un, i.nd)}</div>
        <div class="meta" style="font-size:13px">${i.days.map(([d, v]) => `${d.slice(8,10)}/${d.slice(5,7)}: ${f(v)}`).join(' · ')}</div></div></div>`; }).join('')}</div>`).join('')
      || `<div class="empty">${T('uNone')}</div>`;
  }
  $('#app').innerHTML = `<header><h1>${T('usageT')}</h1><button class="hmenu hx" onclick="closeUsage()" aria-label="Close">✕</button></header>${chips}
    <div class="cmeta" style="padding:10px 14px 0">${T('uHelp')}${UZ.since ? ' ' + T('uSince', UZ.since.slice(8,10) + '/' + UZ.since.slice(5,7)) : ''}</div>${body}<div class="spacer"></div>`;
}
// Order button → confirmation first (what is low), then on to Order from Jinjang
function askStockOrder(){
  const eff = i => (i.id in SEDITS && SEDITS[i.id] !== '' && !isNaN(Number(SEDITS[i.id]))) ? Object.assign({}, i, { qty: Number(SEDITS[i.id]) }) : i;
  const oo = openOrd(), ord = ['Jinjang', 'Bought', 'Noodle'], list = SK.items.map(eff).filter(i => stockNeed(i) - openQ(oo[i.id]) > 0).sort((a, b) => ord.indexOf(grpOf(a)) - ord.indexOf(grpOf(b)));
  $('#sTitle').textContent = T('ordAskT'); $('#sText').textContent = '';
  $('#sList').innerHTML = list.map((i, k) => (k === 0 || grpOf(list[k-1]) !== grpOf(i) ? `<div class="lgh">${T('g' + grpOf(i))}</div>` : '')
      + `<div class="srow"><span>${lineName(i)}</span><b>${esc(Math.ceil(stockNeed(i) - openQ(oo[i.id])))} ${esc(uName(i.unit))}</b></div>`).join('') || `<div class="empty">${T('ordAskNone')}</div>`;
  $('#sBtns').innerHTML = `<button class="btn save" onclick="closeSum();stockOrder()">${T('ordGo')}</button><button class="btn clear" onclick="closeSum()">${T('cancel')}</button>`;
  $('#sum').classList.add('show');
}
// Order: save typed counts and send −1 taps first, then open Order from Jinjang with the fresh numbers
// Opens at once from the numbers already on the phone; saving runs in the background.
async function stockOrder(){
  Object.keys(SEDITS).forEach(id => { const i = SK.items.find(x => x.id === id); if (i && !isNaN(Number(SEDITS[id]))) i.qty = Number(SEDITS[id]); });
  const pend = (async () => { if (Object.keys(SEDITS).length) await saveStock(); await flushUse(); })();
  if (!DV) DV = recall('deliv');
  if (!DV) { const b = document.querySelector('footer .btn'); if (b) { b.disabled = true; b.textContent = T('working'); } await pend; return goJJOrder(); }
  SK.items.forEach(x => { const d = DV.items.find(y => y.id === x.id); if (d) Object.assign(d, { onHand: x.qty, min: x.min, rq: x.rq, par: x.par, smin: x.smin, sq: x.sq, spar: x.spar }); });
  if (DATA && DATA.items) DATA.items.forEach(x => { const d = DV.items.find(y => y.id === x.id && !y.stock); if (d && x.qty !== '' && x.qty !== undefined) d.onHand = Number(x.qty); });
  MODE_SET = 'deliv'; MODE = 'deliv'; newDO('order', true);
  pend.then(() => call('getDeliveries', PIN)).then(d => { if (d && d.items && !DPEND) DV = remember('deliv', d); }).catch(() => {});
}
// Save count: shows as saved at once; the server save runs in the background (numbers come back if it fails)
let SCOUNT = null;
function saveStock(){
  const list = Object.keys(SEDITS).map(id => ({ id, qty: SEDITS[id] }));
  if (list.find(x => isNaN(Number(x.qty)))) { toast(T('numbers')); return Promise.resolve(false); }
  const t = hhmm();
  list.forEach(x => { const i = SK.items.find(y => y.id === x.id); if (i) { i.qty = Number(x.qty); i.days = 0; i.checked = t; i.at = t; } });
  SEDITS = {}; remember('stock', SK); if (MODE === 'stock') redraw(renderStock); toast(T('stockSaved', list.length));
  SCOUNT = (async () => {
    if (SUSE_BUSY || Object.keys(SUSE).length) await flushUse();   // −1 taps first, then the counted numbers
    try { const d = await call('stockCount', PIN, list);
      if (d && d.items && !Object.keys(SEDITS).length && !Object.keys(SUSE).length) { SK = remember('stock', d); if (MODE === 'stock') redraw(renderStock); }
      return true; }
    catch(e){ list.forEach(x => { if (!(x.id in SEDITS)) SEDITS[x.id] = x.qty; }); if (MODE === 'stock') redraw(renderStock); toast(String(e.message||e)); return false; }
    finally { SCOUNT = null; }
  })();
  return SCOUNT;
}

PIN = store.get('xym_pin'); asBar();
if (PIN) load(); else showLogin();
</script>
